version: 2.0

services:
  console:
    deployments:
      replicas: 1
    ports:
      - 8088
    expose:
      - 80
    resources:
      cpu: 0.2
      mem: 1024
    health_check:
      exec:
       cmd: echo 1
  runtime:
    deployments:
      replicas: 1
    ports:
      - 8080
    expose:
      - 80
    resources:
      cpu: 0.2
      mem: 1024
    health_check:
      exec:
       cmd: echo 1
addons:
  mysql:
    plan: mysql:basic
    options:
      create_dbs: dalaran

  redis:
    plan: redis:basic
  monitor:
    plan: monitor:dev