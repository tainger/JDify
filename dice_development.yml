version: 2.0

services:
  console:
    deployments:
      replicas: 1
    ports:
      - 8080
    expose:
      - 80
    resources:
      cpu: 0.1
      mem: 512
    health_check:
      exec:
       cmd: echo 1
addons:
  mysql:
    plan: mysql:basic
    options:
      create_dbs: dalaran
  monitor:
    plan: monitor:dev