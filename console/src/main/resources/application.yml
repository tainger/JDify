server:
  port: 8088
  session:
    timeout: 10400
spring:
  application:
    name: dalaran-console
  aop:
    proxy-target-class: true
    auto: true
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dalaran}?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:secret}
  jpa:
    hibernate.ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL57Dialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  security:
    user:
      name: ${SECURITY_USERNAME:terminus}
      password: ${SECURITY_PASSWORD:anywhere}
      role: ${SECURITY_ROLE:USER}
    ant-matchers: ${ANT_MATCHERS:/api/platform/login/auth}

terminus:
  dalaran:
    runtime-location: ${RUNTIME_LOCATION:http://127.0.0.1:8080}
    log:
      # 目前只支持定时删除
      policy: delete
      # 日志留存时间(h)
      duration: ${DALARAN_DURATION_DAY:7}