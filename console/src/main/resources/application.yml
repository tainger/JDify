server:
  port: 8088
  session:
    timeout: 10400
spring:
  application:
    name: dalaran-console
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:9.154.22.168}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dalaran}?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: ${MYSQL_USERNAME:mysql}
    password: ${MYSQL_PASSWORD:14e7b9bcadc54a36b6bcec899d452f1d}
  jpa:
    hibernate.ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  security:
    user:
      name: ${SECURITY_USERNAME:terminus}
      password: ${SECURITY_PASSWORD:anywhere}
      role: ${SECURITY_ROLE:USER}
    ant-matchers: ${ANT_MATCHERS:/**}

terminus:
  dalaran:
    log:
      # 目前只支持定时删除
      policy: delete
      # 日志留存时间(h)
      duration: ${DALARAN_DURATION_DAY:14}