server:
  port: 8088
spring:
  application:
    name: dalaran-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dalaran;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: root
    password: anywhere
  jpa:
    hibernate.ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
