version: 2
services:
  console:
    deployments:
      replicas: 1
    ports:
      - 8088
    expose:
      - 80
    resources:
      cpu: 0.5
      mem: 1024
    health_check:
      exec:
        cmd: "echo 1"
  runtime:
    deployments:
      replicas: 1
    ports:
      - 8088
    expose:
      - 80
    resources:
      cpu: 2
      mem: 4096
    health_check:
      exec:
        cmd: "echo 1"
addons:
  monitor:
    plan: "monitor:dev"
  dalaran_mysql:
    plan: "mysql:professional"
    options:
      version: "5.7.23"
      create_dbs: dalaran
  注册中心:
    plan: "terminus-roost:basic"
    options:
      version: "0.0.1"
  redis:
    plan: redis:basic
envs: {}
